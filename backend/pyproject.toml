[project]
name = "project-management-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.143.2",
    "joserfc>=1.7.5",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "isort>=9.0.2",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.black]
target-version = ["py314"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
